# MS3DVAR WOOM Compilation Tasks
# ================================
#
# Tasks:
#   compile_mpc     : builds the mpc preprocessor (shared prereq for all variants)
#   compile_filter  : builds ms3dvar-filter
#   compile_lr      : builds ms3dvar-lr
#   compile_mr      : builds ms3dvar-mr
#   compile_ms      : builds ms3dvar-ms
#
# All environment variables (CROCO_SRC, FC, CPP1, CFT1,
# FFLAGS1, CPPFLAGS1, LDFLAGS1, NPROCS) are set by the ms3dvar_compile
# env in hosts.cfg.
#
# Execution order (see workflow.cfg stages):
#   step0: compile_mpc
#   step1: compile_filter, compile_lr, compile_mr, compile_ms  (parallel)


[compile_mpc]

    [[content]]
    env=ms3dvar_compile
    commandline=${FC} -o mpc ${CROCO_SRC}/mpc.F

    [[artifacts]]
        [[[mpc]]]
        path={{ task_run_dir }}/mpc


[compile_filter]

    [[content]]
    env=ms3dvar_compile
    commandline="${CROCO_SRC}/../ASSIM/MS3DVAR/ms3dvar_compile_variant.sh FILTER {{ workflow.get_task_artifact_paths('mpc', 'compile_mpc') }}"

    [[artifacts]]
        [[[ms3dvar-filter]]]
        path={{ task_run_dir }}/ms3dvar-filter


[compile_lr]

    [[content]]
    env=ms3dvar_compile
    commandline="${CROCO_SRC}/../ASSIM/MS3DVAR/ms3dvar_compile_variant.sh LR {{ workflow.get_task_artifact_paths('mpc', 'compile_mpc') }}"

    [[artifacts]]
        [[[ms3dvar-lr]]]
        path={{ task_run_dir }}/ms3dvar-lr


[compile_mr]

    [[content]]
    env=ms3dvar_compile
    commandline="${CROCO_SRC}/../ASSIM/MS3DVAR/ms3dvar_compile_variant.sh MR {{ workflow.get_task_artifact_paths('mpc', 'compile_mpc') }}"

    [[artifacts]]
        [[[ms3dvar-mr]]]
        path={{ task_run_dir }}/ms3dvar-mr


[compile_ms]

    [[content]]
    env=ms3dvar_compile
    commandline="${CROCO_SRC}/../ASSIM/MS3DVAR/ms3dvar_compile_variant.sh MS {{ workflow.get_task_artifact_paths('mpc', 'compile_mpc') }}"

    [[artifacts]]
        [[[ms3dvar-ms]]]
        path={{ task_run_dir }}/ms3dvar-ms
