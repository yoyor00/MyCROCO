# MS3DVAR WOOM Compilation Tasks
# ================================
#
# Tasks:
#   generate_headers: generates cppdefs_ms3dvar.h, das_param.h, param_ms3dvar.h
#                     from ms3dvar.cfg + croco.cfg in the workflow directory.
#                     These three files are shared by all variants (LR, MR, MS, FILTER)
#                     — all variants include cppdefs_ms3dvar.h from COMMON/.
#   compile_mpc     : builds the mpc preprocessor (shared prereq for all variants)
#   compile_filter  : builds ms3dvar-filter
#   compile_lr      : builds ms3dvar-lr
#   compile_mr      : builds ms3dvar-mr
#   compile_ms      : builds ms3dvar-ms
#
# All environment variables (CROCO_SRC, FC, CPP1, CFT1,
# FFLAGS1, CPPFLAGS1, LDFLAGS1, NPROCS) are set by the ms3dvar_compile
# env in hosts.cfg.  generate_headers uses the pycroco env.
#
# Execution order (see workflow.cfg stages):
#   step0: compile_mpc, generate_headers  (parallel)
#   step1: compile_filter, compile_lr, compile_mr, compile_ms  (parallel, after step0)


[generate_headers]

    [[content]]
    env=pycroco
    commandline="""pycroco ms3dvar generate cppdefs \
        --ms3dvar-config ${WOOM_WORKFLOW_DIR}/ms3dvar.cfg \
        --croco-config   ${WOOM_WORKFLOW_DIR}/croco.cfg \
        --croco-src-dir  ${CROCO_SRC}/.. && \
    pycroco ms3dvar generate param_h \
        --ms3dvar-config ${WOOM_WORKFLOW_DIR}/ms3dvar.cfg \
        --croco-config   ${WOOM_WORKFLOW_DIR}/croco.cfg \
        --croco-src-dir  ${CROCO_SRC}/.."""

    [[artifacts]]
        [[[cppdefs_ms3dvar.h]]]
        path=cppdefs_ms3dvar.h

        [[[das_param.h]]]
        path=das_param.h

        [[[param_ms3dvar.h]]]
        path=param_ms3dvar.h


[compile_mpc]

    [[content]]
    env=ms3dvar_compile
    commandline=${FC} -o mpc ${CROCO_SRC}/mpc.F

    [[artifacts]]
        [[[mpc]]]
        # task_run_dir is required here: other tasks reference this artifact
        # via workflow.get_task_artifact_paths — relative paths render in the
        # wrong task context without the explicit prefix.
        path={{ task_run_dir }}/mpc


[compile_filter]

    [[content]]
    env=ms3dvar_compile
    commandline="""${CROCO_SRC}/../ASSIM/MS3DVAR/ms3dvar_compile_variant.sh FILTER \
        {{ workflow.get_task_artifact_paths('mpc', 'compile_mpc') }} \
        {{ workflow.get_task_run_dir('generate_headers') }}"""

    [[artifacts]]
        [[[ms3dvar-filter]]]
        path=ms3dvar-filter


[compile_lr]

    [[content]]
    env=ms3dvar_compile
    commandline="""${CROCO_SRC}/../ASSIM/MS3DVAR/ms3dvar_compile_variant.sh LR \
        {{ workflow.get_task_artifact_paths('mpc', 'compile_mpc') }} \
        {{ workflow.get_task_run_dir('generate_headers') }}"""

    [[artifacts]]
        [[[ms3dvar-lr]]]
        path=ms3dvar-lr


[compile_mr]

    [[content]]
    env=ms3dvar_compile
    commandline="""${CROCO_SRC}/../ASSIM/MS3DVAR/ms3dvar_compile_variant.sh MR \
        {{ workflow.get_task_artifact_paths('mpc', 'compile_mpc') }} \
        {{ workflow.get_task_run_dir('generate_headers') }}"""

    [[artifacts]]
        [[[ms3dvar-mr]]]
        path=ms3dvar-mr


[compile_ms]

    [[content]]
    env=ms3dvar_compile
    commandline="""${CROCO_SRC}/../ASSIM/MS3DVAR/ms3dvar_compile_variant.sh MS \
        {{ workflow.get_task_artifact_paths('mpc', 'compile_mpc') }} \
        {{ workflow.get_task_run_dir('generate_headers') }}"""

    [[artifacts]]
        [[[ms3dvar-ms]]]
        path=ms3dvar-ms
