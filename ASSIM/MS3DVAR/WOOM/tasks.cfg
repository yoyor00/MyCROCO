# MS3DVAR WOOM Compilation Tasks
# ================================
#
# Tasks:
#   compile_mpc     : builds the mpc preprocessor (shared prereq for all scales)
#   compile_filter  : builds ms3dvar-filter
#   compile_lr      : builds ms3dvar-lr
#   compile_mr      : builds ms3dvar-mr
#   compile_ms      : builds ms3dvar-ms
#   compile_all     : builds all 4 scales sequentially, in one task (each in
#                     its own run_dir/<scale>/ subdirectory). NOT part of
#                     the default step1 stage below -- that still uses the
#                     4 parallel per-scale tasks, which is the better
#                     default for production (independent artifacts,
#                     parallel execution, per-scale retry). compile_all is
#                     an alternative for when a single sequential task is
#                     preferred; swap it in for step1 in workflow.cfg if so.
#
# All environment variables (MS3DVAR_SRC, CROCO_SRC, FC, CPP1, CFT1,
# FFLAGS1, CPPFLAGS1, LDFLAGS1, NPROCS) are set by the ms3dvar_compile
# env in hosts.cfg.
#
# Each compile_<scale> task also passes --user-files {{ workflow_dir }}/user_files
# (a WOOM template variable resolved when this commandline is rendered --
# hosts.cfg's vars.set values are copied raw, not Jinja-rendered, so this
# has to be here rather than in hosts.cfg). It points at WOOM/user_files/,
# shipped alongside this workflow's own config files; ms3dvar_compile_scale.sh
# copies WOOM/user_files/<scale>/* in last, overriding any other source, if
# that directory exists.
#
# Execution order (see workflow.cfg stages):
#   step0: compile_mpc
#   step1: compile_filter, compile_lr, compile_mr, compile_ms  (parallel)


[compile_mpc]

    [[content]]
    env=ms3dvar_compile
    commandline="""${FC} -o mpc ${CROCO_SRC}/mpc.F"""

    [[artifacts]]
    mpc={{ run_dir }}/mpc


[compile_filter]

    [[content]]
    env=ms3dvar_compile
    commandline="""$MS3DVAR_SRC/TOOLS/ms3dvar_compile_scale.sh FILTER {{ workflow.get_artifact('mpc', 'compile_mpc', 'prolog') }} --user-files {{ workflow_dir }}/user_files"""

    [[artifacts]]
    ms3dvar-filter={{ run_dir }}/ms3dvar-filter


[compile_lr]

    [[content]]
    env=ms3dvar_compile
    commandline="""$MS3DVAR_SRC/TOOLS/ms3dvar_compile_scale.sh LR {{ workflow.get_artifact('mpc', 'compile_mpc', 'prolog') }} --user-files {{ workflow_dir }}/user_files"""

    [[artifacts]]
    ms3dvar-lr={{ run_dir }}/ms3dvar-lr


[compile_mr]

    [[content]]
    env=ms3dvar_compile
    commandline="""$MS3DVAR_SRC/TOOLS/ms3dvar_compile_scale.sh MR {{ workflow.get_artifact('mpc', 'compile_mpc', 'prolog') }} --user-files {{ workflow_dir }}/user_files"""

    [[artifacts]]
    ms3dvar-mr={{ run_dir }}/ms3dvar-mr


[compile_ms]

    [[content]]
    env=ms3dvar_compile
    commandline="""$MS3DVAR_SRC/TOOLS/ms3dvar_compile_scale.sh MS {{ workflow.get_artifact('mpc', 'compile_mpc', 'prolog') }} --user-files {{ workflow_dir }}/user_files"""

    [[artifacts]]
    ms3dvar-ms={{ run_dir }}/ms3dvar-ms


[compile_all]

    [[content]]
    env=ms3dvar_compile
    commandline="""$MS3DVAR_SRC/TOOLS/ms3dvar_compile_scale.sh ALL {{ workflow.get_artifact('mpc', 'compile_mpc', 'prolog') }} --user-files {{ workflow_dir }}/user_files"""

    [[artifacts]]
    ms3dvar-filter={{ run_dir }}/filter/ms3dvar-filter
    ms3dvar-lr={{ run_dir }}/lr/ms3dvar-lr
    ms3dvar-mr={{ run_dir }}/mr/ms3dvar-mr
    ms3dvar-ms={{ run_dir }}/ms/ms3dvar-ms
