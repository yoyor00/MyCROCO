# ci croco
stages:
  - bench
  - report

variables:
  DATAROOTPATH: "/data"

# ─── Templates ────────────────────────────────────────────────────────────

.schedule: &schedule
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

.artifacts: &artifacts
  paths: [BENCH/results]
  when: always
  expire_in: 1 week

.gfortran: &gfortran
  stage: bench
  tags: [ci.inria.fr, large]
  image: registry.gitlab.inria.fr/croco-ocean/croco_docker/debian_gfortran:dev

.gfortran_parallel: &gfortran_parallel
  stage: bench
  tags: [ci.inria.fr, large]
  image: registry.gitlab.inria.fr/croco-ocean/croco_docker/ubuntu_gfortran_parallel:dev

.ifx: &ifx
  stage: bench
  tags: [ci.inria.fr, large_more_disk]
  image: registry.gitlab.inria.fr/croco-ocean/croco_docker/ubuntu_intel_parallel:dev

# ─── gfortran base: debug (always-on) ─────────────────────────────────────

debug_base:
  <<: *gfortran
  script:
    - cd $CI_PROJECT_DIR/BENCH && source /venv/bin/activate
    - |
      ./bench-croco.py \
      --case @base,@nbq,@sediment_mustang,@other \
      --variants @debug \
      --title debug \
      --debug \
      --rebuild \
      --host host_ci \
      --html \
      -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/debug-host_ci/junit_report.xml

debug_vortex:
  <<: *gfortran
  script:
    - cd $CI_PROJECT_DIR/BENCH && source /venv/bin/activate
    - |
      ./bench-croco.py \
      --case VORTEX* \
      --variants sequential,mpi-4 \
      --title vortex \
      --debug \
      --rebuild \
      --host host_ci \
      --html \
      -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/vortex-host_ci/junit_report.xml

# ─── gfortran_parallel: debug (always-on, matrix) ─────────────────────────

debug_gfortran_parallel:
  <<: *gfortran_parallel
  parallel:
    matrix:
      - CASES: "@realist_base"
        TITLE: "debug_realist_base"
      - CASES: "@agrif_realist"
        TITLE: "debug_agrif_realist"
  script:
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py \
      --case "$CASES" \
      --variants sequential,mpi-4 \
      --title "$TITLE" \
      --debug \
      --rebuild \
      --host host_ci \
      --data-root-path $DATAROOTPATH \
      --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── gfortran base: debug complement (schedule) ───────────────────────────

debug_complement:
  <<: [*gfortran, *schedule]
  script:
    - cd $CI_PROJECT_DIR/BENCH && source /venv/bin/activate
    - |
      ./bench-croco.py \
      --case @complement \
      --variants @debug \
      --title debug-complement \
      --debug \
      --rebuild \
      --host host_ci \
      --html \
      -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/debug-complement-host_ci/junit_report.xml

# ─── gfortran base: plotphy (schedule, matrix) ────────────────────────────

plotphy_gfortran:
  <<: [*gfortran, *schedule]
  parallel:
    matrix:
      - CASES: "@base,@nbq,@sediment_mustang,@other"
        VARIANTS: "mpi-2"
        TITLE: "plotphy"
      - CASES: "VORTEX*"
        VARIANTS: "mpi-4"
        TITLE: "plotphy_vortex"
      - CASES: "@complement"
        VARIANTS: "mpi-2"
        TITLE: "plotphy-complement"
      - CASES: "@complement_sequential_only"
        VARIANTS: "sequential"
        TITLE: "plotphy-complement-sequential"
  script:
    - cd $CI_PROJECT_DIR/BENCH && source /venv/bin/activate
    - |
      ./bench-croco.py \
      --case "$CASES" \
      --variants "$VARIANTS" \
      --title "$TITLE" \
      -s build,run,plotphy \
      --rebuild \
      --host host_ci \
      --html \
      -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── Intel/ifx: debug (schedule, matrix) ──────────────────────────────────
# note: check step done on sequential-ifx

debug_ifx:
  <<: [*ifx, *schedule]
  parallel:
    matrix:
      - CASES: "@base,@nbq,@sediment_mustang,@other"
        TITLE: "debug_ifx-base"
      - CASES: "@realist"
        TITLE: "debug_ifx-realist"
      - CASES: "@agrif_realist"
        TITLE: "debug_ifx-agrif_realist"
  script:
    - ulimit -s unlimited
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py \
      --case "$CASES" \
      --variants @debug-ifx \
      --compare-to sequential-ifx \
      --title "$TITLE" \
      --debug \
      --rebuild \
      --host host_ci \
      --data-root-path $DATAROOTPATH \
      --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── gfortran_parallel: debug (schedule, matrix) ──────────────────────────

debug_gfortran_parallel_schedule:
  <<: [*gfortran_parallel, *schedule]
  parallel:
    matrix:
      - CASES: "@realist"
        TITLE: "debug_realist"
      - CASES: "@agrif_realist_complement"
        TITLE: "debug_agrif_realist_complement"
  script:
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py \
      --case "$CASES" \
      --variants sequential,mpi-4 \
      --title "$TITLE" \
      --debug \
      --rebuild \
      --host host_ci \
      --data-root-path $DATAROOTPATH \
      --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── gfortran_parallel: restart unique schedule jobs ──────────────────────────────

restart_realist:
  <<: [*gfortran_parallel, *schedule]
  script:
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py \
      --case @realist \
      --variants mpi-4 \
      --compare-to mpi-4 \
      --title restart_realist \
      --restart \
      --rebuild \
      --host host_ci \
      --data-root-path $DATAROOTPATH \
      --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/restart_realist-host_ci/junit_report.xml

plotphy_realist:
  <<: [*gfortran_parallel, *schedule]
  script:
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py \
      --case BENGUELA_LR_TIDES_BULK,VILAINE \
      --variants mpi-4 \
      --title plotphy_realist \
      -s build,run,plotphy \
      --rebuild \
      --host host_ci \
      --data-root-path $DATAROOTPATH \
      --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/plotphy_realist-host_ci/junit_report.xml

# ─── Performance tracking ─────────────────────────────────────────────────

track_perf:
  <<: *gfortran_parallel
  script:
    - |
      mkdir -p $CI_PROJECT_DIR/BENCH/previous
      cd $CI_PROJECT_DIR/BENCH/previous
      echo "Project ID: $CI_PROJECT_ID"
      echo "Commit Ref: $CI_COMMIT_REF_NAME"
      echo "Downloading artifacts for job: track_perf"
      curl --fail --location --output artifacts.zip \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "https://gitlab.inria.fr/api/v4/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/download?job=track_perf" \
          || echo "No artifact available. Continuing without previous data."
      if [ -f artifacts.zip ]; then unzip artifacts.zip; fi
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py \
      --case BASIN,BENGUELA_LR_TIDES_BULK \
      --variants sequential,mpi-4 \
      --title track-perf \
      -s build,run,plotperf,trackperf \
      -l $CI_PROJECT_DIR/BENCH/previous/BENCH/results/track-perf-host_ci/trackperf_summary.csv \
      --rebuild \
      --data-root-path $DATAROOTPATH \
      --host host_ci \
      --html \
      -N --report --no_date_in_result_dir
  artifacts:
    paths: [BENCH/results]
    when: always
    expire_in: 1 month
    reports:
      junit: BENCH/results/track-perf-host_ci/junit_report.xml

# ─── Pages ────────────────────────────────────────────────────────────────

pages:
  stage: report
  tags: [ci.inria.fr]
  image: registry.gitlab.inria.fr/croco-ocean/croco_docker/debian_gfortran:dev_nml
  script:
    - mkdir -p $CI_PROJECT_DIR/public
    - cd $CI_PROJECT_DIR/BENCH && source /venv/bin/activate
    - ./bench-croco.py --globalhtml
    - cp -R $CI_PROJECT_DIR/BENCH/results $CI_PROJECT_DIR/public
  artifacts:
    paths: [public]
    when: always
    expire_in: 1 week
  when: always
