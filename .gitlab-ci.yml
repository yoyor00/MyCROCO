# ci croco
stages:
  - bench
  - report

variables:
  DATAROOTPATH: "/data"

# ─── Templates ────────────────────────────────────────────────────────────

.schedule: &schedule
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

.artifacts: &artifacts
  paths: [BENCH/results]
  when: always
  expire_in: 1 week

.gfortran: &gfortran
  stage: bench
  tags: [ci.inria.fr, large]
  image: registry.gitlab.inria.fr/croco-ocean/croco_docker/debian_gfortran:dev

.gfortran_parallel: &gfortran_parallel
  stage: bench
  tags: [ci.inria.fr, large]
  image: registry.gitlab.inria.fr/croco-ocean/croco_docker/ubuntu_gfortran_parallel:dev

.ifx: &ifx
  stage: bench
  tags: [ci.inria.fr, large_more_disk]
  image: registry.gitlab.inria.fr/croco-ocean/croco_docker/ubuntu_intel_parallel:dev

# ─── gfortran (always-on) ─────────────────────────────────────────────────

gfortran:
  <<: *gfortran
  parallel:
    matrix:
      - { CASES: "@base",             VARIANTS: "@debug",           TITLE: "debug_base",             OPTIONS: "--debug" }
      - { CASES: "@nbq",              VARIANTS: "@debug",           TITLE: "debug_nbq",              OPTIONS: "--debug" }
      - { CASES: "@sediment_mustang", VARIANTS: "@debug",           TITLE: "debug_sediment_mustang", OPTIONS: "--debug" }
      - { CASES: "@other",            VARIANTS: "@debug",           TITLE: "debug_other",            OPTIONS: "--debug" }
      - { CASES: "VORTEX*",           VARIANTS: "sequential,mpi-4", TITLE: "debug_vortex",           OPTIONS: "--debug" }
  script:
    - cd $CI_PROJECT_DIR/BENCH && source /venv/bin/activate
    - |
      ./bench-croco.py --case "$CASES" --variants "$VARIANTS" --title "$TITLE" $OPTIONS \
      --rebuild --host host_ci --data-root-path $DATAROOTPATH --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── gfortran_parallel (always-on) ────────────────────────────────────────

gfortran_parallel:
  <<: *gfortran_parallel
  parallel:
    matrix:
      - { CASES: "@realist_base",  VARIANTS: "sequential,mpi-4", TITLE: "debug_realist_base",  OPTIONS: "--debug" }
      - { CASES: "@agrif_realist", VARIANTS: "sequential,mpi-4", TITLE: "debug_agrif_realist", OPTIONS: "--debug" }
  script:
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py --case "$CASES" --variants "$VARIANTS" --title "$TITLE" $OPTIONS \
      --rebuild --host host_ci --data-root-path $DATAROOTPATH --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── gfortran (schedule) ──────────────────────────────────────────────────

gfortran_schedule:
  <<: [*gfortran, *schedule]
  parallel:
    matrix:
      - { CASES: "@complement",                 VARIANTS: "@debug",     TITLE: "debug-complement",              OPTIONS: "--debug" }
      - { CASES: "@base",                       VARIANTS: "mpi-2",      TITLE: "plotphy_base",                  OPTIONS: "-s build,run,plotphy" }
      - { CASES: "@nbq",                        VARIANTS: "mpi-2",      TITLE: "plotphy_nbq",                   OPTIONS: "-s build,run,plotphy" }
      - { CASES: "@sediment_mustang",           VARIANTS: "mpi-2",      TITLE: "plotphy_sediment_mustang",      OPTIONS: "-s build,run,plotphy" }
      - { CASES: "@other",                      VARIANTS: "mpi-2",      TITLE: "plotphy_other",                 OPTIONS: "-s build,run,plotphy" }
      - { CASES: "VORTEX*",                     VARIANTS: "mpi-4",      TITLE: "plotphy_vortex",                OPTIONS: "-s build,run,plotphy" }
      - { CASES: "@complement",                 VARIANTS: "mpi-2",      TITLE: "plotphy-complement",            OPTIONS: "-s build,run,plotphy" }
      - { CASES: "@complement_sequential_only", VARIANTS: "sequential", TITLE: "plotphy-complement-sequential", OPTIONS: "-s build,run,plotphy" }
  script:
    - cd $CI_PROJECT_DIR/BENCH && source /venv/bin/activate
    - |
      ./bench-croco.py --case "$CASES" --variants "$VARIANTS" --title "$TITLE" $OPTIONS \
      --rebuild --host host_ci --data-root-path $DATAROOTPATH --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── gfortran_parallel (schedule) ─────────────────────────────────────────

gfortran_parallel_schedule:
  <<: [*gfortran_parallel, *schedule]
  parallel:
    matrix:
      - { CASES: "@realist",                       VARIANTS: "sequential,mpi-4", TITLE: "debug_realist",                  OPTIONS: "--debug" }
      - { CASES: "@agrif_realist_complement",      VARIANTS: "sequential,mpi-4", TITLE: "debug_agrif_realist_complement", OPTIONS: "--debug" }
      - { CASES: "@realist",                       VARIANTS: "mpi-4",            TITLE: "restart_realist",                OPTIONS: "--restart --compare-to mpi-4" }
      - { CASES: "BENGUELA_LR_TIDES_BULK,VILAINE", VARIANTS: "mpi-4",            TITLE: "plotphy_realist",                OPTIONS: "-s build,run,plotphy" }
  script:
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py --case "$CASES" --variants "$VARIANTS" --title "$TITLE" $OPTIONS \
      --rebuild --host host_ci --data-root-path $DATAROOTPATH --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── ifx (schedule) ───────────────────────────────────────────────────────

ifx_schedule:
  <<: [*ifx, *schedule]
  parallel:
    matrix:
      - { CASES: "@base",             VARIANTS: "@debug-ifx", TITLE: "debug_ifx-base",             OPTIONS: "--debug --compare-to sequential-ifx" }
      - { CASES: "@nbq",              VARIANTS: "@debug-ifx", TITLE: "debug_ifx-nbq",              OPTIONS: "--debug --compare-to sequential-ifx" }
      - { CASES: "@sediment_mustang", VARIANTS: "@debug-ifx", TITLE: "debug_ifx-sediment_mustang", OPTIONS: "--debug --compare-to sequential-ifx" }
      - { CASES: "@other",            VARIANTS: "@debug-ifx", TITLE: "debug_ifx-other",            OPTIONS: "--debug --compare-to sequential-ifx" }
      - { CASES: "@realist",          VARIANTS: "@debug-ifx", TITLE: "debug_ifx-realist",          OPTIONS: "--debug --compare-to sequential-ifx" }
      - { CASES: "@agrif_realist",    VARIANTS: "@debug-ifx", TITLE: "debug_ifx-agrif_realist",    OPTIONS: "--debug --compare-to sequential-ifx" }
  script:
    - ulimit -s unlimited
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py --case "$CASES" --variants "$VARIANTS" --title "$TITLE" $OPTIONS \
      --rebuild --host host_ci --data-root-path $DATAROOTPATH --html -N --report --no_date_in_result_dir
  artifacts:
    <<: *artifacts
    reports:
      junit: BENCH/results/$TITLE-host_ci/junit_report.xml

# ─── Performance tracking ─────────────────────────────────────────────────

track_perf:
  <<: *gfortran_parallel
  script:
    - |
      mkdir -p $CI_PROJECT_DIR/BENCH/previous
      cd $CI_PROJECT_DIR/BENCH/previous
      echo "Project ID: $CI_PROJECT_ID"
      echo "Commit Ref: $CI_COMMIT_REF_NAME"
      echo "Downloading artifacts for job: track_perf"
      curl --fail --location --output artifacts.zip \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "https://gitlab.inria.fr/api/v4/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/download?job=track_perf" \
          || echo "No artifact available. Continuing without previous data."
      if [ -f artifacts.zip ]; then unzip artifacts.zip; fi
    - cd $CI_PROJECT_DIR/BENCH
    - |
      ./bench-croco.py \
      --case BASIN,BENGUELA_LR_TIDES_BULK \
      --variants sequential,mpi-4 \
      --title track-perf \
      -s build,run,plotperf,trackperf \
      -l $CI_PROJECT_DIR/BENCH/previous/BENCH/results/track-perf-host_ci/trackperf_summary.csv \
      --rebuild \
      --data-root-path $DATAROOTPATH \
      --host host_ci \
      --html \
      -N --report --no_date_in_result_dir
  artifacts:
    paths: [BENCH/results]
    when: always
    expire_in: 1 month
    reports:
      junit: BENCH/results/track-perf-host_ci/junit_report.xml

# ─── Pages ────────────────────────────────────────────────────────────────

pages:
  stage: report
  tags: [ci.inria.fr]
  image: registry.gitlab.inria.fr/croco-ocean/croco_docker/debian_gfortran:dev_nml
  script:
    - mkdir -p $CI_PROJECT_DIR/public
    - cd $CI_PROJECT_DIR/BENCH && source /venv/bin/activate
    - ./bench-croco.py --globalhtml
    - cp -R $CI_PROJECT_DIR/BENCH/results $CI_PROJECT_DIR/public
  artifacts:
    paths: [public]
    when: always
    expire_in: 1 week
  when: always
